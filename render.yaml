# Optional PAID persistent hosting. Review the service/disk cost in Render before
# creating this Blueprint. No service is created by extracting or installing it.
services:
  - type: web
    name: orkestryn
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python app/hosted_server.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: rehearsal-evidence
      mountPath: /var/data/agent-rehearsal
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: AR_STATE_ROOT
        value: /var/data/agent-rehearsal
      - key: AR_PUBLIC_ORIGIN
        sync: false
      - key: AR_ADMIN_PASSWORD
        sync: false
      - key: AR_MANAGER_PASSWORD
        sync: false
      - key: AR_CUSTOMER_PASSWORD
        sync: false
      - key: AR_LIVE_PROPOSALS
        value: "1"
      - key: AR_MAX_OUTPUT_TOKENS
        value: "8192"
      - key: NEBIUS_API_KEY
        sync: false
