name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up dashboard test runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tracked publication contents
        run: python -B -S scripts/check_repository.py --staged
      - name: Check setup
        run: python -B -S app/project.py doctor
      - name: Use a canonical temporary directory
        # Hosted Windows TEMP can use RUNNER~1, which strict path guards reject.
        run: python -B -S -c "import os; from pathlib import Path; root = str(Path(os.environ['RUNNER_TEMP']).resolve()); Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('TMPDIR=' + root + '\nTEMP=' + root + '\nTMP=' + root + '\n')"
      - name: Check test-runner failure reporting
        run: python -B -S -m unittest discover -s scripts -p test_runner_tests.py -v
      - name: Diagnose Windows core regressions
        if: runner.os == 'Windows'
        run: python -B -S scripts/test.py --jobs 1 --modules desktop_tests operations_factory_tests safety_tests --output "${{ runner.temp }}/core-tests"
      - name: Run complete offline Python suite
        run: python -B -S scripts/test.py --output "${{ runner.temp }}/offline-tests"
      - name: Run dashboard behavior checks
        if: ${{ !cancelled() }}
        run: python -B -S app/operations_ui_checks.py
      - name: Run Safety Lab interface checks
        if: ${{ !cancelled() }}
        run: python -B -S app/safety_ui_checks.py --output "${{ runner.temp }}/safety-ui-checks.json"
      - name: Build the portable distribution
        if: ${{ !cancelled() }}
        run: python -B -S scripts/build_release.py --output "${{ runner.temp }}/portable-build"
      - name: Exercise the packaged walkthrough
        if: ${{ !cancelled() }}
        run: python -B "${{ runner.temp }}/portable-build/Orkestryn.pyz" --check --directory "${{ runner.temp }}/portable-smoke"
      - name: Retain test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/core-tests
            ${{ runner.temp }}/offline-tests
            ${{ runner.temp }}/safety-ui-checks.json
          retention-days: 7
          if-no-files-found: warn
  inspect-research:
    name: Optional Inspect adapter / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned optional research tool
        run: python -m pip install -r app/requirements-research.txt
      - name: Compare Inspect results with local replay; no model calls
        run: python -B app/safety_inspect_check.py --output "${{ runner.temp }}/research-check"
