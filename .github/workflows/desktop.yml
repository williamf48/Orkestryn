name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            file: Orkestryn.exe
          - os: macos-latest
            name: macos
            file: Orkestryn
          - os: ubuntu-latest
            name: linux
            file: Orkestryn
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify public source
        run: python scripts/check_repository.py
      - name: Install native build tool
        run: python -m pip install PyInstaller==6.22.3
      - name: Build native executable
        run: python app/build_desktop.py --native --output "${{ runner.temp }}/native/${{ matrix.file }}"
      - name: Check the produced executable without a model request
        shell: bash
        run: '"${{ runner.temp }}/native/${{ matrix.file }}" --console --check --directory "${{ runner.temp }}/private-native-check"'
      - name: Upload checked platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orkestryn-${{ matrix.name }}-${{ runner.arch }}
          path: ${{ runner.temp }}/native/${{ matrix.file }}
          if-no-files-found: error
